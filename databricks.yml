bundle:
  name: genie-agent
  engine: direct

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse ID for the Genie space
    default: 2eb5285a512501b6

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    resources:
      genie_spaces:
        genie_agent:
          title: '[Dev] Genie Agent'
          warehouse_id: ${var.warehouse_id}
          parent_path: /Workspace/Users/${workspace.current_user.userName}

  test:
    mode: production
    workspace:
      host: https://dbc-62578fc7-e122.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      warehouse_id: 7474653114242811
    permissions:
      - user_name: ganesh.nayak@datazymes.com
        level: CAN_MANAGE
      - user_name: himanshu.kashyap@datazymes.com
        level: CAN_MANAGE
    resources:
      genie_spaces:
        genie_agent:
          title: '[Test] Genie Agent'
          warehouse_id: ${var.warehouse_id}
          parent_path: /Workspace/Users/${workspace.current_user.userName}
